name: Busca diária Smiles

on:
  schedule:
    - cron: "17 10 * * *"   # todo dia às 07:17 (horário de Brasília)
  workflow_dispatch:         # permite rodar manualmente pela aba Actions

permissions:
  contents: write            # para salvar o histórico em dados/

concurrency:
  group: busca-smiles
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Buscar passagens
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
        run: python buscador.py

      - name: Salvar histórico no repositório
        if: always()
        run: |
          git config user.name "buscador-smiles[bot]"
          git config user.email "buscador-smiles@users.noreply.github.com"
          git add dados/ || true
          git diff --cached --quiet || git commit -m "Resultados da busca de $(date +%F)"
          git push || true
